{% extends 'ukoly/base.html' %}

{% block content %}
    {% for ukol in ukoly %}
        <article class="ukol">
            <time class="termin">
                termín: {{ ukol.termin|default:"bez termínu" }}
            </time>
            <h2><a href="{% url 'ukol_detail' pk=ukol.pk %}">{{ ukol.nazev }}</a></h2>
            <p>{{ ukol.popis|linebreaksbr }}</p>
        </article>
    {% endfor %}
{% endblock %}
