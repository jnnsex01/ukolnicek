{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Úkolníček</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" ...>
        <link rel="stylesheet" href="{% static 'css/ukoly.css' %}">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lobster&subset=latin,latin-ext">
    </head>
    <body>
        <header class="page-header">
            <div class="container">
                <h1><a href="/">Úkolníček</a></h1>
            </div>
        </header>

        <main class="container">
            <div class="row">
                <div class="col">
                    {% for ukol in ukoly %}
                        <article class="ukol">
                            <time class="termin">
                                termín: {{ ukol.termin|default:"bez termínu" }}
                            </time>
                            <h2><a href="">{{ ukol.nazev }}</a></h2>
                            <p>{{ ukol.popis|linebreaksbr }}</p>
                        </article>
                    {% endfor %}
                </div>
            </div>
        </main>
    </body>
</html>
